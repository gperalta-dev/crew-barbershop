<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} | {{tagline}}</title>
<meta name="description" content="{{name}}: {{intro}} {{address}}.">
<meta name="robots" content="noindex">
<style>
:root{--accent:{{accent}};--ink:#16181a;--muted:#5b6166;--bg:#faf8f5;--card:#fff;--line:#e6e2db}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header.hero{background:var(--ink);color:#fff;padding:56px 0 40px}
.hero h1{margin:0 0 8px;font-size:2.2rem;line-height:1.1;letter-spacing:-.02em}
.hero p{margin:0 0 24px;color:#d5d8da}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 22px;border-radius:10px;font-weight:600;text-decoration:none;text-align:center;min-height:48px;border:2px solid var(--accent);background:var(--accent);color:#fff}
.btn.alt{background:transparent;color:#fff;border-color:#fff}
.btn.off{opacity:.65;cursor:not-allowed}
section{padding:32px 0;border-bottom:1px solid var(--line)}
h2{margin:0 0 14px;font-size:1.3rem}
ul.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
ul.list li{display:flex;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
.tbc{color:var(--muted);font-style:italic}
a{color:var(--accent)}
.note{color:var(--muted);font-size:.9rem;margin-top:10px}
footer{padding:24px 0 40px;color:var(--muted);font-size:.85rem;text-align:center}
@media(min-width:700px){.hero h1{font-size:3rem}header.hero{padding:88px 0 56px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
<h1>{{name}}</h1>
<p>{{tagline}}. {{intro}}</p>
<div class="btns">{{callButton}}{{bookButton}}<a class="btn alt" href="{{mapUrl}}" target="_blank" rel="noopener">Get directions</a></div>
</div></header>
<main class="wrap">
<section id="services"><h2>Services &amp; prices</h2>
<ul class="list">{{services}}</ul></section>
<section id="hours"><h2>Hours</h2>
<ul class="list">{{hours}}</ul></section>
<section id="location"><h2>Find us</h2>
<p>{{address}}{{landmark}}</p>
<p><a href="{{mapUrl}}" target="_blank" rel="noopener">Open in Google Maps</a></p></section>
<section id="booking"><h2>Book a cut</h2>
<p>{{bookingText}}</p></section>
</main>
<footer><div class="wrap">Preview by Local Studio</div></footer>
</body>
</html>
